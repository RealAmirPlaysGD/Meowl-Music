<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <link rel="icon" type="image/png" href="icon.png">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3a724ef7-44af-4cfc-b880-e5f3a72ea3b0"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #meowl-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status-banner {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      box-sizing: border-box;
      width: 100%;
      font-size: 24px;
      color: red;
      font-weight: bold;
      padding: 20px;
      text-align: center;
      background: yellow;
    }

    body.edit-mode {
      outline: 4px solid #ff4fd8;
      outline-offset: -4px;
    }

#edit-exit-mode {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #b00075;
      font: bold 14px sans-serif;
      cursor: pointer;
    }
    #admin-toggle {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 8;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      color: white;
      background: rgba(0, 0, 0, 0.45);
      font-size: 18px;
      cursor: pointer;
      opacity: 0.35;
    }

    #admin-toggle:hover,
    #admin-toggle:focus-visible {
      opacity: 1;
    }

    #admin-panel {
      position: fixed;
      right: 12px;
      bottom: 54px;
      z-index: 8;
      width: min(260px, calc(100vw - 24px));
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #777;
      border-radius: 10px;
      color: white;
      background: rgba(20, 20, 20, 0.95);
      font: 14px sans-serif;
    }

    #admin-panel[hidden] {
      display: none;
    }

    #admin-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #admin-panel button[data-event] {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 8px;
      border: 0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
    }

    .event-warning {
      margin: 10px 2px 0;
      color: #ffd66b;
      font-size: 12px;
      line-height: 1.4;
    }

    #meowl-image.disco-mode {
      animation: meowl-disco 2s linear infinite;
    }

    #floating-meowls.disco-mode {
      animation: meowl-rainbow 2s linear infinite;
      will-change: filter;
    }

    @keyframes meowl-disco {
      to { filter: hue-rotate(360deg); }
    }

    @keyframes meowl-rainbow {
      to { filter: hue-rotate(360deg); }
    }

    #floating-meowls {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
      display: block;
      width: 100%;
      height: 100%;
    }


    #jarona-layer {
      position: fixed;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    .jarona-meowl {
      position: absolute;
      display: block;
      max-width: none;
      transform: translate(-50%, -50%) scale(0.1);
      transform-origin: center;
      animation: jarona-grow 2600ms cubic-bezier(0.18, 0.75, 0.3, 1) forwards;
    }

    @keyframes jarona-grow {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
      8% { opacity: 1; }
      84% { opacity: 1; transform: translate(-50%, -50%) scale(5.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(6.5); }
    }
    body.cracking-open { background: #000; }

    #crack-lines,
    #crack-shards {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #crack-lines[hidden],
    #crack-shards[hidden] {
      display: none;
    }

    #crack-lines path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    #crack-lines .crack-shadow {
      stroke: #080808;
      stroke-width: 22;
    }

    #crack-lines .crack-highlight {
      stroke: #fff;
      stroke-width: 6;
      filter: drop-shadow(0 0 5px #fff);
    }

    #crack-line-two-shadow,
    #crack-line-two-highlight {
      opacity: 0;
    }

    #crack-lines.first-crack #crack-line-one-shadow,
    #crack-lines.first-crack #crack-line-one-highlight {
      animation: crack-line-draw 0.55s ease-out forwards;
    }

    #crack-lines.second-crack #crack-line-two-shadow,
    #crack-lines.second-crack #crack-line-two-highlight {
      opacity: 1;
      animation: crack-line-draw 0.55s ease-out forwards;
    }

    #rebuild-workers {
      position: fixed;
      inset: 0;
      z-index: 4;
      overflow: hidden;
      pointer-events: none;
    }

    #rebuild-workers[hidden] {
      display: none;
    }

    .rebuild-worker {
      position: absolute;
      bottom: 8px;
      width: 52px;
      height: 58px;
      animation: worker-search 1.8s ease-in-out infinite alternate;
    }

    .rebuild-worker img {
      position: absolute;
      bottom: 0;
      left: 3px;
      width: 46px;
      height: auto;
      animation: worker-bob 0.42s steps(2, end) infinite;
    }

    .worker-hat {
      position: absolute;
      top: 5px;
      left: 14px;
      z-index: 1;
      width: 23px;
      height: 11px;
      border-radius: 10px 10px 2px 2px;
      background: #ff8a00;
      transform: rotate(-8deg);
    }

    .worker-hat::after {
      position: absolute;
      right: -4px;
      bottom: -2px;
      left: -4px;
      height: 3px;
      border-radius: 3px;
      background: #db6500;
      content: "";
    }

    @keyframes worker-search {
      to { transform: translateX(24px); }
    }

    @keyframes worker-bob {
      50% { transform: translateY(-3px); }
    }

    @keyframes crack-line-draw {
      to { stroke-dashoffset: 0; }
    }

    #jarona-flowery {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9;
      width: 120px;
      height: 120px;
      object-fit: contain;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    body.jarona-active,
    body.jarona-active * {
      cursor: none !important;
    }

    #jarona-flowery[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="status-banner">free music wow</div>
  <img id="meowl-image" src="meowl.png" alt="Meowl">
  <audio id="meowl-audio" src="meowl.mp3.mp3" loop></audio>
  <audio id="meow-sound" src="meow.mp3" preload="auto"></audio>
  <audio id="zesty-sound" src="meow-zesty.mp3" preload="auto"></audio>
  <audio id="admin-audio" src="meowlwow.mp3" loop preload="auto"></audio>
  <audio id="disco-audio" src="disco.mp3" preload="auto" loop></audio>
  <audio id="joke-audio" src="joke.mp3" preload="auto"></audio>
  <audio id="jarona-spawn-audio" src="meowl-Jarona.mp3" preload="auto"></audio>
  <div id="jarona-layer" aria-hidden="true"></div>
  <audio id="rift-audio" src="cracking.mp3" preload="auto"></audio>
  <audio id="shatter-audio" src="screen shatter.mp3" preload="auto"></audio>
  <audio id="rift-music" src="EVERY END.ogg" preload="auto" loop></audio>
  <svg id="crack-lines" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true" hidden>
    <path id="crack-line-one-shadow" class="crack-shadow" pathLength="1" d="M 1000 468 L 928 501 L 854 452 L 779 482 L 708 433 L 629 478 L 554 444 L 481 503 L 402 459 L 326 512 L 249 469 L 175 526 L 102 482 L 0 534"></path>
    <path id="crack-line-one-highlight" class="crack-highlight" pathLength="1" d="M 1000 468 L 928 501 L 854 452 L 779 482 L 708 433 L 629 478 L 554 444 L 481 503 L 402 459 L 326 512 L 249 469 L 175 526 L 102 482 L 0 534"></path>
    <path id="crack-line-two-shadow" class="crack-shadow" pathLength="1" d="M 508 0 L 479 83 L 525 156 L 462 230 L 505 307 L 448 379 L 486 450 L 424 524 L 468 598 L 407 675 L 451 748 L 392 821 L 432 900 L 382 1000"></path>
    <path id="crack-line-two-highlight" class="crack-highlight" pathLength="1" d="M 508 0 L 479 83 L 525 156 L 462 230 L 505 307 L 448 379 L 486 450 L 424 524 L 468 598 L 407 675 L 451 748 L 392 821 L 432 900 L 382 1000"></path>
  </svg>
  <canvas id="crack-shards" aria-hidden="true" hidden></canvas>
  <div id="rebuild-workers" aria-hidden="true" hidden></div>
  <img id="jarona-flowery" src="flowery.png" alt="" hidden>
  <canvas id="floating-meowls" aria-hidden="true"></canvas>
  <button id="edit-exit-mode" type="button" contenteditable="false" hidden>Exit edit mode</button>
  <button id="admin-toggle" type="button" aria-label="Open secret event panel" aria-expanded="false" title="">⚙</button>
  <section id="admin-panel" aria-label="Secret event panel" hidden>
    <h2>Meowl event panel</h2>
    <button type="button" data-event="countdown">Start admin countdown (1 minute)</button>
    <button type="button" data-event="admin-now">Start admin event now (4 minutes)</button>
    <button type="button" data-event="meow">Play secret meow sound</button>
    <button type="button" data-event="disco">Disco meowl (1 minute)</button>
    <button type="button" data-event="rift">Breaking Open (2 minutes)</button>
    <button type="button" data-event="disco-countdown">Start disco countdown (1 minute)</button>
    <button type="button" data-event="jarona">Jarona! (3 minutes 12 seconds)</button>
    <button type="button" data-event="jarona-countdown">Jarona! countdown (2 minutes)</button>
    <p class="event-warning">Warning: Disco mode has no image limit and may slow down your browser.</p>
  </section>
  <script>
    const audio = document.getElementById("meowl-audio");
    const image = document.getElementById("meowl-image");
    const meowSound = document.getElementById("meow-sound");
    const zestySound = document.getElementById("zesty-sound");
    const adminAudio = document.getElementById("admin-audio");
    const discoAudio = document.getElementById("disco-audio");
    const jokeAudio = document.getElementById("joke-audio");
    const jaronaSpawnAudio = document.getElementById("jarona-spawn-audio");
    const jaronaLayer = document.getElementById("jarona-layer");
    const crackLines = document.getElementById("crack-lines");
    const crackShards = document.getElementById("crack-shards");
    const crackContext = crackShards.getContext("2d");
    const rebuildWorkers = document.getElementById("rebuild-workers");
    const crackAudio = document.getElementById("rift-audio");
    const shatterAudio = document.getElementById("shatter-audio");
    const riftMusic = document.getElementById("rift-music");
    const jaronaFlowery = document.getElementById("jarona-flowery");
    const banner = document.getElementById("status-banner");
    const editExitButton = document.getElementById("edit-exit-mode");
    const floatingMeowls = document.getElementById("floating-meowls");
    const floatingContext = floatingMeowls.getContext("2d", { alpha: true });
    const floatingSprite = new Image();
    floatingSprite.src = "disco meowl.png";
    const adminToggle = document.getElementById("admin-toggle");
    const adminPanel = document.getElementById("admin-panel");
    const rotatingMessages = [
      "free music meowl",
      "free musics",
      "free meowl music",
      "＼(＾▽＾)／",
      "yay",
      "lala",
      "lLALALALLALALAL",
      "lalalalalalll",
      "allalalallalal",
      "music by meowl made with love by meowl",
      "we love meowls yay",
      "we love meowls"
    ];
    const maxFloatingMeowls = 20;
    const discoCopiesPerCollision = 20;
    const discoBatchCooldown = 300;
    let imageResetTimeout;
    let textTimer;
    let countdownTimer;
    let effectTimer;
    let spawnTimer;
    let countdownActive = false;
    let discoCountdownActive = false;
    let adminEventActive = false;
    let adminAudioWasPlaying = false;
    let discoActive = false;
    let crackingOpenActive = false;
    let crackingStage = 0;
    let crackingOriginalMessage = "";
    let crackingIdleTimer;
    let crackTextTimer;
    let crackShatterFrame;
    let crackShatterStartTimer;
    let lastCrackFrame = 0;
    let crackPieces = [];
    let crackRebuilding = false;
    let crackRebuildStartedAt = 0;
    let crackRebuildTimer;
    let crackRebuildStartTimer;
    const crackSprite = new Image();
    crackSprite.src = "meowl.png";
    const rebuildSprite = new Image();
    rebuildSprite.src = "meowl.png";
    let jaronaCountdownActive = false;
    let jaronaActive = false;
    let pointerInsideWindow = true;
    let jaronaSpawnTimer;
    let jaronaEndTimer;
    let discoTimer;
    let discoRainbowDelay = "0ms";
    let lastMessage = "free music wow";
    let floatingMeowlMotion = [];
    let activeCollisionPairs = new Set();
    let lastCollisionBurstAt = -Infinity;
    let lastCollisionCheckAt = -Infinity;
    let animationFrameId;
    let lastAnimationFrame = 0;
    let editMode = false;
    let bannerClickCount = 0;
    let pageClickCount = 0;
    let pageClickResetTimer;

    function resizeFloatingCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      floatingMeowls.width = Math.round(window.innerWidth * ratio);
      floatingMeowls.height = Math.round(window.innerHeight * ratio);
      floatingContext.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    resizeFloatingCanvas();
    window.addEventListener("resize", resizeFloatingCanvas);
    function setEditMode(enabled) {
      editMode = enabled;
      bannerClickCount = 0;
      document.body.contentEditable = String(editMode);
      document.body.spellcheck = editMode;
      document.body.classList.toggle("edit-mode", editMode);
      editExitButton.hidden = !editMode;
    }
    banner.addEventListener("click", () => {
      bannerClickCount += 1;
      if (bannerClickCount < 5) return;
      setEditMode(!editMode);
    });
    editExitButton.addEventListener("click", () => setEditMode(false));
    document.addEventListener("pointermove", (event) => {
      pointerInsideWindow = true;
      jaronaFlowery.style.left = event.clientX + "px";
      jaronaFlowery.style.top = event.clientY + "px";
    });
    document.addEventListener("pointerleave", () => {
      pointerInsideWindow = false;
      if (!jaronaActive) return;
      jaronaFlowery.style.left = window.innerWidth / 2 + "px";
      jaronaFlowery.style.top = "76px";
    });

    document.addEventListener("click", (event) => {
      if (editMode || !canStartEvent()) {
        pageClickCount = 0;
        clearTimeout(pageClickResetTimer);
        return;
      }
      if (event.target.closest("button, #status-banner, #admin-panel")) return;

      pageClickCount += 1;
      clearTimeout(pageClickResetTimer);
      pageClickResetTimer = setTimeout(() => {
        pageClickCount = 0;
      }, 2500);

      if (pageClickCount >= 8) {
        pageClickCount = 0;
        clearTimeout(pageClickResetTimer);
        startRiftEvent();
        if (audio.paused) audio.play();
      }
    });

    image.addEventListener("click", () => {
      if (adminEventActive) return;
      if (crackingOpenActive) {
        if (crackingStage < 3) advanceCrackingOpen();
        return;
      }
      if (canStartEvent() && Math.random() < 0.03) {
        startRiftEvent();
        if (audio.paused) audio.play();
        return;
      }

      if (audio.paused) {
        audio.play();
        return;
      }

      triggerMeowReaction();
    });

    function triggerMeowReaction(useZesty = false) {
      image.src = "meowl2.png";
      const reactionSound = useZesty || Math.random() < 0.05 ? zestySound : meowSound;
      reactionSound.currentTime = 0;
      reactionSound.play();
      clearTimeout(imageResetTimeout);
      imageResetTimeout = setTimeout(() => {
        image.src = "meowl.png";
      }, 300);
    }

    function canStartEvent() {
      return !editMode && !countdownActive && !discoCountdownActive && !jaronaCountdownActive && !adminEventActive && !discoActive && !jaronaActive && !crackingOpenActive;
    }

    function startDiscoEvent() {
      if (!canStartEvent()) return;
      discoActive = true;
      discoAudio.currentTime = 0;
      discoAudio.play();
      discoRainbowDelay = `${-(performance.now() % 2000)}ms`;
      image.classList.add("disco-mode");
      image.style.animationDelay = discoRainbowDelay;
      floatingMeowls.classList.add("disco-mode");
      floatingMeowls.style.animationDelay = discoRainbowDelay;
      banner.innerText = "meowl disco mode!";
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      floatingMeowlMotion = [];
      activeCollisionPairs.clear();
      lastCollisionBurstAt = -Infinity;
      lastCollisionCheckAt = -Infinity;
      for (let i = 0; i < 2; i += 1) addFloatingMeowl();
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      discoTimer = setTimeout(() => {
        image.classList.remove("disco-mode");
        image.style.removeProperty("animation-delay");
        floatingMeowls.classList.remove("disco-mode");
        floatingMeowls.style.removeProperty("animation-delay");
        discoActive = false;
        discoAudio.pause();
        discoAudio.currentTime = 0;
        cancelAnimationFrame(animationFrameId);
        floatingMeowlMotion = [];
        activeCollisionPairs.clear();
        floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
        showRandomMessage();
      }, 60000);
    }

    adminToggle.addEventListener("click", () => {
      adminPanel.hidden = !adminPanel.hidden;
      adminToggle.setAttribute("aria-expanded", String(!adminPanel.hidden));
    });

    adminPanel.addEventListener("click", (event) => {
      const eventButton = event.target.closest("[data-event]");
      if (!eventButton) return;

      if (eventButton.dataset.event === "meow") {
        triggerMeowReaction(true);
      } else if (eventButton.dataset.event === "rift" && canStartEvent()) {
        startRiftEvent();
      } else if (eventButton.dataset.event === "disco") {
        startDiscoEvent();
      } else if (eventButton.dataset.event === "countdown" && canStartEvent()) {
        beginAdminCountdown();
      } else if (eventButton.dataset.event === "disco-countdown" && canStartEvent()) {
        beginDiscoCountdown();
      } else if (eventButton.dataset.event === "jarona" && canStartEvent()) {
        startJaronaEvent();
      } else if (eventButton.dataset.event === "jarona-countdown" && canStartEvent()) {
        beginJaronaCountdown();
      } else if (eventButton.dataset.event === "admin-now" && canStartEvent()) {
        startAdminEvent();
      }

      adminPanel.hidden = true;
      adminToggle.setAttribute("aria-expanded", "false");
    });

    function showRandomMessage() {
      let message;
      do {
        message = rotatingMessages[Math.floor(Math.random() * rotatingMessages.length)];
      } while (message === lastMessage);

      lastMessage = message;
      banner.innerText = message;
    }

    function beginAdminCountdown() {
      countdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          startAdminEvent();
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "meowl admin abuse in 1 minute"
          : `meowl admin abuse in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function beginDiscoCountdown() {
      discoCountdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          discoCountdownActive = false;
          startDiscoEvent();
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "disco in 1 minute"
          : `disco in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function beginJaronaCountdown() {
      if (!canStartEvent()) return;
      jaronaCountdownActive = true;
      const countdownEndsAt = Date.now() + 120000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          jaronaCountdownActive = false;
          startJaronaEvent();
          return;
        }

        const minutesLeft = Math.floor(secondsLeft / 60);
        const secondsInMinute = secondsLeft % 60;
        banner.innerText = secondsLeft === 120
          ? "Jarona! in 2 minutes"
          : "Jarona! in " + minutesLeft + ":" + String(secondsInMinute).padStart(2, "0");
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function spawnJaronaMeowl() {
      const meowl = document.createElement("img");
      const size = 70 + Math.random() * 100;
      meowl.className = "jarona-meowl";
      meowl.src = "disco meowl.png";
      meowl.alt = "";
      meowl.style.width = size + "px";
      meowl.style.left = Math.random() * window.innerWidth + "px";
      meowl.style.top = Math.random() * window.innerHeight + "px";
      meowl.addEventListener("animationend", () => meowl.remove(), { once: true });
      jaronaLayer.appendChild(meowl);

      const spawnSound = jaronaSpawnAudio.cloneNode();
      spawnSound.currentTime = 0;
      spawnSound.addEventListener("ended", () => spawnSound.remove(), { once: true });
      spawnSound.play().catch(() => {});
    }

    function startJaronaEvent() {
      if (!canStartEvent()) return;
      jaronaActive = true;
      banner.innerText = "Jarona!";
      jaronaFlowery.hidden = false;
      if (!pointerInsideWindow) {
        jaronaFlowery.style.left = window.innerWidth / 2 + "px";
        jaronaFlowery.style.top = "76px";
      }
      document.body.classList.add("jarona-active");
      jokeAudio.currentTime = 0;
      jokeAudio.play().catch(() => {});
      spawnJaronaMeowl();
      jaronaSpawnTimer = setInterval(spawnJaronaMeowl, 600);
      jaronaEndTimer = setTimeout(() => {
        clearInterval(jaronaSpawnTimer);
        jaronaActive = false;
        jaronaFlowery.hidden = true;
        document.body.classList.remove("jarona-active");
        showRandomMessage();
      }, 192000);
    }
    function playCrackSound() {
      crackAudio.currentTime = 0;
      crackAudio.playbackRate = 0.75 + Math.random() * 0.5;
      crackAudio.preservesPitch = false;
      crackAudio.webkitPreservesPitch = false;
      crackAudio.mozPreservesPitch = false;
      const playback = crackAudio.play();
      if (playback && typeof playback.catch === "function") playback.catch(() => {});
    }

    function resetCrackingOpen() {
      if (!crackingOpenActive || crackingStage >= 3) return;
      clearTimeout(crackingIdleTimer);
      clearTimeout(crackTextTimer);
      clearTimeout(crackShatterStartTimer);
      clearTimeout(crackRebuildStartTimer);
      clearTimeout(crackRebuildTimer);
      cancelAnimationFrame(crackShatterFrame);
      crackShards.hidden = true;
      rebuildWorkers.hidden = true;
      rebuildWorkers.replaceChildren();
      crackContext.clearRect(0, 0, crackShards.width, crackShards.height);
      crackLines.hidden = true;
      crackLines.classList.remove("first-crack");
      crackLines.classList.remove("second-crack");
      document.body.classList.remove("cracking-open");
      image.style.visibility = "";
      image.hidden = false;
      image.src = "meowl.png";
      banner.innerText = crackingOriginalMessage;
      crackPieces = [];
      crackingStage = 0;
      crackingOpenActive = false;
      riftMusic.pause();
      riftMusic.currentTime = 0;
    }

    function restartCrackingIdleTimer() {
      clearTimeout(crackingIdleTimer);
      crackingIdleTimer = setTimeout(resetCrackingOpen, 10000);
    }

    function startCrackingOpen() {
      crackingOpenActive = true;
      riftMusic.currentTime = 0;
      riftMusic.play().catch(() => {});
      crackingOriginalMessage = banner.innerText;
      crackingStage = 1;
      clearTimeout(imageResetTimeout);
      image.src = "meowl.png";
      banner.innerText = "uhmm what";
      crackLines.hidden = false;
      crackLines.classList.remove("first-crack");
      crackLines.classList.remove("second-crack");
      crackLines.classList.add("first-crack");
      trackMeowlEvent("cracking_open");
      playCrackSound();
      restartCrackingIdleTimer();
    }

    function advanceCrackingOpen() {
      crackingStage += 1;
      if (crackingStage === 2) {
        banner.innerText = "okay stop you are litereally somehow breaking the fourth wall";
        crackLines.classList.add("second-crack");
        playCrackSound();
      } else {
        banner.innerText = "WHAT HAVE YOU DONE";
        crackLines.hidden = true;
        shatterAudio.pause();
        shatterAudio.currentTime = 0;
        let shatterDelayStarted = false;
        const startShatterDelay = () => {
          if (shatterDelayStarted) return;
          shatterDelayStarted = true;
          crackShatterStartTimer = setTimeout(() => {
            if (!crackingOpenActive || crackingStage !== 3) return;
            document.body.classList.add("cracking-open");
            image.style.visibility = "hidden";
            startCrackShatter();
            crackRebuildStartTimer = setTimeout(startCrackRebuild, 20000);
          }, 2000);
        };
        shatterAudio.addEventListener("playing", startShatterDelay, { once: true });
        const shatterPlayback = shatterAudio.play();
        if (shatterPlayback && typeof shatterPlayback.then === "function") {
          shatterPlayback.then(startShatterDelay).catch(startShatterDelay);
        } else {
          startShatterDelay();
        }
        clearTimeout(crackingIdleTimer);
        crackTextTimer = setTimeout(() => {
          if (crackingOpenActive && crackingStage === 3) banner.innerText = "..";
        }, 1000);
        return;
      }
      restartCrackingIdleTimer();
    }

    function startCrackRebuild() {
      if (!crackingOpenActive || crackingStage !== 3) return;
      if (!rebuildSprite.complete || !rebuildSprite.naturalWidth) {
        rebuildSprite.addEventListener("load", startCrackRebuild, { once: true });
        return;
      }

      crackRebuilding = true;
      crackRebuildStartedAt = performance.now();
      for (const piece of crackPieces) {
        piece.rebuildFromX = piece.dx;
        piece.rebuildFromY = piece.dy;
        piece.rebuildFromRotation = piece.rotation;
        piece.rebuildDelay = Math.random() * 41000;
        piece.rebuildDuration = 10000 + Math.random() * 8000;
      }

      const workerPositions = [8, 27, 47, 67, 87];
      rebuildWorkers.replaceChildren();
      workerPositions.forEach((position, index) => {
        const worker = document.createElement("div");
        worker.className = "rebuild-worker";
        worker.style.left = `${position}%`;
        worker.style.animationDuration = `${1.3 + Math.random() * 1.6}s`;
        worker.style.animationDelay = `${index * 0.13}s`;
        const imageElement = document.createElement("img");
        imageElement.src = "meowl.png";
        imageElement.alt = "";
        const hat = document.createElement("span");
        hat.className = "worker-hat";
        worker.append(imageElement, hat);
        rebuildWorkers.append(worker);
      });
      rebuildWorkers.hidden = false;
      crackShards.hidden = false;
      lastCrackFrame = 0;
      crackShatterFrame = requestAnimationFrame(moveCrackShards);
      crackRebuildTimer = setTimeout(finishCrackRebuild, 60000);
    }

    function finishCrackRebuild() {
      if (!crackingOpenActive || !crackRebuilding) return;
      clearTimeout(crackRebuildTimer);
      cancelAnimationFrame(crackShatterFrame);
      crackRebuilding = false;
      crackShards.hidden = true;
      crackContext.clearRect(0, 0, crackShards.width, crackShards.height);
      rebuildWorkers.hidden = true;
      rebuildWorkers.replaceChildren();
      document.body.classList.remove("cracking-open");
      image.style.visibility = "";
      image.hidden = false;
      image.src = "meowl.png";
      banner.innerText = crackingOriginalMessage;
      crackPieces = [];
      crackingStage = 0;
      crackingOpenActive = false;
      riftMusic.pause();
      riftMusic.currentTime = 0;
    }

    function startCrackShatter() {
      if (!crackSprite.complete || !crackSprite.naturalWidth) {
        crackSprite.addEventListener("load", () => {
          if (crackingOpenActive && crackingStage === 3) startCrackShatter();
        }, { once: true });
        return;
      }

      const width = window.innerWidth;
      const height = window.innerHeight;
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      crackShards.width = Math.round(width * ratio);
      crackShards.height = Math.round(height * ratio);
      crackContext.setTransform(ratio, 0, 0, ratio, 0, 0);
      crackShards.hidden = false;

      const columns = 8;
      const rows = 6;
      const pieceWidth = width / columns;
      const pieceHeight = height / rows;
      const scale = Math.max(width / crackSprite.naturalWidth, height / crackSprite.naturalHeight);
      const sourceWidth = width / scale;
      const sourceHeight = height / scale;
      const sourceX = (crackSprite.naturalWidth - sourceWidth) / 2;
      const sourceY = (crackSprite.naturalHeight - sourceHeight) / 2;
      const vertices = [];
      const jaggedEdges = new Map();
      crackPieces = [];

      for (let row = 0; row <= rows; row += 1) {
        const vertexRow = [];
        for (let column = 0; column <= columns; column += 1) {
          const edge = row === 0 || row === rows || column === 0 || column === columns;
          const jitterX = edge ? 0 : (Math.random() - 0.5) * pieceWidth * 0.7;
          const jitterY = edge ? 0 : (Math.random() - 0.5) * pieceHeight * 0.7;
          vertexRow.push({
            id: row * (columns + 1) + column,
            x: column * pieceWidth + jitterX,
            y: row * pieceHeight + jitterY
          });
        }
        vertices.push(vertexRow);
      }

      for (let row = 0; row < rows; row += 1) {
        for (let column = 0; column < columns; column += 1) {
          const topLeft = vertices[row][column];
          const topRight = vertices[row][column + 1];
          const bottomRight = vertices[row + 1][column + 1];
          const bottomLeft = vertices[row + 1][column];
          const triangles = Math.random() < 0.5
            ? [[topLeft, topRight, bottomRight], [topLeft, bottomRight, bottomLeft]]
            : [[topLeft, topRight, bottomLeft], [topRight, bottomRight, bottomLeft]];

          for (const points of triangles) {
            const polygon = [];
            for (let edgeIndex = 0; edgeIndex < points.length; edgeIndex += 1) {
              const start = points[edgeIndex];
              const end = points[(edgeIndex + 1) % points.length];
              const edgeKey = `${Math.min(start.id, end.id)}:${Math.max(start.id, end.id)}`;
              if (!jaggedEdges.has(edgeKey)) {
                const forward = start.id < end.id;
                const first = forward ? start : end;
                const last = forward ? end : start;
                const dx = last.x - first.x;
                const dy = last.y - first.y;
                const length = Math.hypot(dx, dy) || 1;
                const edgePoints = [first];
                for (let step = 1; step <= 3; step += 1) {
                  const progress = step / 4;
                  const jaggedness = (Math.random() - 0.5) * 14;
                  edgePoints.push({
                    x: first.x + dx * progress - dy / length * jaggedness,
                    y: first.y + dy * progress + dx / length * jaggedness
                  });
                }
                edgePoints.push(last);
                jaggedEdges.set(edgeKey, edgePoints);
              }
              const edgePoints = jaggedEdges.get(edgeKey);
              const orderedPoints = start.id < end.id ? edgePoints : edgePoints.slice().reverse();
              polygon.push(...orderedPoints.slice(0, -1));
            }

            const centerX = polygon.reduce((sum, point) => sum + point.x, 0) / polygon.length;
            const centerY = polygon.reduce((sum, point) => sum + point.y, 0) / polygon.length;
            const minX = Math.min(...polygon.map((point) => point.x));
            const maxX = Math.max(...polygon.map((point) => point.x));
            const minY = Math.min(...polygon.map((point) => point.y));
            const maxY = Math.max(...polygon.map((point) => point.y));
            crackPieces.push({
              points: polygon,
              centerX,
              centerY,
              minX,
              minY,
              width: maxX - minX,
              height: maxY - minY,
              sx: sourceX + minX / scale,
              sy: sourceY + minY / scale,
              sw: (maxX - minX) / scale,
              sh: (maxY - minY) / scale,
              dx: 0,
              dy: 0,
              vx: (Math.random() - 0.5) * 3,
              vy: 0.5 + Math.random() * 1.8,
              rotation: 0,
              rotationSpeed: (Math.random() - 0.5) * 0.07
            });
          }
        }
      }

      lastCrackFrame = 0;
      crackShatterFrame = requestAnimationFrame(moveCrackShards);
    }

    function moveCrackShards(timestamp) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const rebuildingFor = crackRebuilding ? timestamp - crackRebuildStartedAt : 0;
      const frameScale = lastCrackFrame
        ? Math.min((timestamp - lastCrackFrame) / 16.67, 3)
        : 1;
      lastCrackFrame = timestamp;
      crackContext.clearRect(0, 0, width, height);
      crackContext.strokeStyle = "rgba(0, 0, 0, 0.9)";
      crackContext.lineWidth = 1.5;
      let piecesRemain = false;

      for (const piece of crackPieces) {
        if (crackRebuilding) {
          const pieceElapsed = rebuildingFor - piece.rebuildDelay;
          const progress = Math.max(0, Math.min(1, pieceElapsed / piece.rebuildDuration));
          const eased = progress * progress * (3 - 2 * progress);
          piece.dx = piece.rebuildFromX * (1 - eased);
          piece.dy = piece.rebuildFromY * (1 - eased);
          piece.rotation = piece.rebuildFromRotation * (1 - eased);
          if (progress < 1) piecesRemain = true;
        } else {
          piece.dx += piece.vx * frameScale;
          piece.vy += 0.17 * frameScale;
          piece.dy += piece.vy * frameScale;
          piece.rotation += piece.rotationSpeed * frameScale;
          if (piece.centerY + piece.dy < height + piece.height) piecesRemain = true;
        }

        crackContext.save();
        crackContext.translate(piece.centerX + piece.dx, piece.centerY + piece.dy);
        crackContext.rotate(piece.rotation);
        crackContext.beginPath();
        piece.points.forEach((point, index) => {
          const x = point.x - piece.centerX;
          const y = point.y - piece.centerY;
          if (index === 0) crackContext.moveTo(x, y);
          else crackContext.lineTo(x, y);
        });
        crackContext.closePath();
        crackContext.clip();
        crackContext.drawImage(
          crackRebuilding ? rebuildSprite : crackSprite,
          piece.sx, piece.sy, piece.sw, piece.sh,
          piece.minX - piece.centerX, piece.minY - piece.centerY,
          piece.width, piece.height
        );
        crackContext.strokeStyle = "rgba(0, 0, 0, 0.9)";
        crackContext.lineWidth = 1.5;
        crackContext.stroke();
        crackContext.strokeStyle = "rgba(255, 255, 255, 0.45)";
        crackContext.lineWidth = 0.6;
        crackContext.stroke();
        crackContext.restore();
      }

      if (crackRebuilding && rebuildingFor >= 60000) {
        finishCrackRebuild();
      } else if (crackRebuilding && crackingOpenActive) {
        crackShatterFrame = requestAnimationFrame(moveCrackShards);
      } else if (piecesRemain && crackingOpenActive) {
        crackShatterFrame = requestAnimationFrame(moveCrackShards);
      } else {
        crackShards.hidden = true;
      }
    }

    function startRiftEvent() {
      if (!canStartEvent()) return;
      startCrackingOpen();
    }

    function addFloatingMeowl(options = {}) {
      const size = options.size ?? 55 + Math.random() * 95;
      const width = Math.round(size);
      const height = Math.round(size * 850 / 770);
      const maxX = Math.max(0, window.innerWidth - width);
      const maxY = Math.max(0, window.innerHeight - height);
      const x = Math.max(0, Math.min(options.x ?? Math.random() * maxX, maxX));
      const y = Math.max(0, Math.min(options.y ?? Math.random() * maxY, maxY));
      floatingMeowlMotion.push({
        x,
        y,
        width,
        height,
        vx: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        vy: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        ...(options.velocity || {})
      });
    }

    function moveFloatingMeowls(timestamp) {
      const motionCount = floatingMeowlMotion.length;
      const frameInterval = motionCount > 5000 ? 1000 / 15 : motionCount > 1000 ? 1000 / 30 : 0;
      if (frameInterval && timestamp - lastAnimationFrame < frameInterval) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
        return;
      }
      const frameScale = lastAnimationFrame
        ? Math.min((timestamp - lastAnimationFrame) / 16.67, 5)
        : 1;
      lastAnimationFrame = timestamp;

      for (let i = 0; i < motionCount; i += 1) {
        const meowl = floatingMeowlMotion[i];
        const maxX = Math.max(0, window.innerWidth - meowl.width);
        const maxY = Math.max(0, window.innerHeight - meowl.height);
        meowl.x += meowl.vx * frameScale;
        meowl.y += meowl.vy * frameScale;

        if (meowl.x <= 0 || meowl.x >= maxX) {
          meowl.x = Math.max(0, Math.min(meowl.x, maxX));
          meowl.vx *= -1;
        }
        if (meowl.y <= 0 || meowl.y >= maxY) {
          meowl.y = Math.max(0, Math.min(meowl.y, maxY));
          meowl.vy *= -1;
        }

      }

      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (floatingSprite.complete && floatingSprite.naturalWidth) {
        for (const meowl of floatingMeowlMotion) {
          floatingContext.drawImage(floatingSprite, meowl.x, meowl.y, meowl.width, meowl.height);
        }
      }

      if (discoActive && timestamp - lastCollisionCheckAt >= 100) {
        lastCollisionCheckAt = timestamp;
        const collisionsThisFrame = new Set();
        const countAtFrameStart = floatingMeowlMotion.length;
        const cellSize = 256;
        const grid = new Map();

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const meowl = floatingMeowlMotion[i];
          const cellX = Math.floor((meowl.x + meowl.width / 2) / cellSize);
          const cellY = Math.floor((meowl.y + meowl.height / 2) / cellSize);
          const key = `${cellX}:${cellY}`;
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(i);
        }

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const first = floatingMeowlMotion[i];
          const cellX = Math.floor((first.x + first.width / 2) / cellSize);
          const cellY = Math.floor((first.y + first.height / 2) / cellSize);
          for (let neighborX = cellX - 1; neighborX <= cellX + 1; neighborX += 1) {
            for (let neighborY = cellY - 1; neighborY <= cellY + 1; neighborY += 1) {
              const neighbors = grid.get(`${neighborX}:${neighborY}`) || [];
              for (const j of neighbors) {
                if (j <= i) continue;
                const second = floatingMeowlMotion[j];
                const overlaps = Math.abs(first.x + first.width / 2 - second.x - second.width / 2)
                    < (first.width + second.width) / 2
                  && Math.abs(first.y + first.height / 2 - second.y - second.height / 2)
                    < (first.height + second.height) / 2;
                if (!overlaps) continue;

                const pairKey = `${i}:${j}`;
                collisionsThisFrame.add(pairKey);
                if (activeCollisionPairs.has(pairKey)) continue;

                const centerX = (first.x + first.width / 2 + second.x + second.width / 2) / 2;
                const centerY = (first.y + first.height / 2 + second.y + second.height / 2) / 2;
                if (timestamp - lastCollisionBurstAt < discoBatchCooldown) continue;
                lastCollisionBurstAt = timestamp;
                const parentSize = (first.width + second.width) / 2;
                const firstCopyAngle = Math.random() * Math.PI * 2;
                for (let copy = 0; copy < discoCopiesPerCollision; copy += 1) {
                  const size = Math.max(24, Math.min(190, parentSize * (0.55 + Math.random() * 0.9)));
                  const angle = firstCopyAngle + copy * Math.PI * 2 / discoCopiesPerCollision;
                  const speed = 3 + Math.random() * 3;
                  const burstRadius = parentSize * 0.75 + size * 0.75;
                  addFloatingMeowl({
                    x: centerX - size / 2 + Math.cos(angle) * burstRadius,
                    y: centerY - size * 850 / 770 / 2 + Math.sin(angle) * burstRadius,
                    size,
                    velocity: {
                      vx: Math.cos(angle) * speed,
                      vy: Math.sin(angle) * speed
                    }
                  });
                }
              }
            }
          }
        }

        activeCollisionPairs = collisionsThisFrame;
      }

      if (adminEventActive || discoActive) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      }
    }

    function startAdminEvent() {
      countdownActive = false;
      if (editMode) return;
      adminEventActive = true;
      adminAudioWasPlaying = !audio.paused;
      audio.pause();
      adminAudio.currentTime = 0;
      adminAudio.play();
      banner.innerText = "meowl admin abuse!";
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);

      let floatingCount = 0;
      function burst() {
        for (let i = 0; i < 4 && floatingCount < maxFloatingMeowls; i += 1) {
          addFloatingMeowl();
          floatingCount += 1;
        }
        if (floatingCount >= maxFloatingMeowls) clearInterval(spawnTimer);
      }

      burst();
      spawnTimer = setInterval(burst, 700);
      effectTimer = setTimeout(endAdminEvent, 240000);
    }

    function endAdminEvent() {
      clearInterval(spawnTimer);
      cancelAnimationFrame(animationFrameId);
      floatingMeowlMotion = [];
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      adminAudio.pause();
      adminAudio.currentTime = 0;
      adminEventActive = false;
      showRandomMessage();
      if (adminAudioWasPlaying) audio.play();
    }

    textTimer = setInterval(() => {
      if (editMode || countdownActive || discoCountdownActive || jaronaCountdownActive || adminEventActive || discoActive || jaronaActive || crackingOpenActive) return;
      showRandomMessage();
      const chance = Math.random();
      if (chance < 0.01) beginAdminCountdown();
      else if (chance < 0.02) beginDiscoCountdown();
      else if (chance < 0.12) beginJaronaCountdown();
    }, 5000);
  </script>
